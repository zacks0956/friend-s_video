<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary Movie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/assets/main-1BAaBmxQ.css">
</head>
<body>
    <main class="player">
        <div class="video-container">
            <video id="video" playsinline>
                <source src="/assets/message-Bo69tGpR.mp4" type="video/mp4">
            </video>
            
            <div id="play-overlay" class="play-overlay">
                <button type="button">tap</button>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('play-overlay');

        overlay.addEventListener('click', () => {
            video.play();
            video.controls = true;
            overlay.style.display = 'none';
        });
    </script>
</body>
</html>
