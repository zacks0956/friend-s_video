<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary Movie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="player">
        <section class="hero" aria-label="Anniversary movie introduction">
            <p class="eyebrow">ANNIVERSARY MOVIE</p>
            <h1>Friend's Video</h1>
            <p class="lead">大切な時間を、やわらかく上品に残すためのビデオプレーヤーです。</p>
        </section>

        <div class="video-container">
            <video id="video" controls playsinline>
                <source src="video/test.mp4" type="video/mp4">
            </video>
            
            <div id="play-overlay" class="play-overlay">
                <button type="button">tap</button>
            </div>
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('play-overlay');

        overlay.addEventListener('click', () => {
            video.play();
            overlay.style.display = 'none';
        });
    </script>
</body>
</html>
